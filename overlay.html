<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hype Meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: only light; --banner-scale: .694444; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body { color: #fff; font-family: Inter, Arial, sans-serif; }
  .screen { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }

  .banner {
    position: absolute; z-index: 3; top: 24px; left: 24px;
    width: 720px; height: 96px; padding: 12px 16px;
    display: grid; grid-template-columns: 190px 1fr 170px; align-items: center; gap: 14px;
    border-radius: 8px; color: #fff;
    background: linear-gradient(110deg, #9146ff 0%, #9146ff 58%, #8438f5 100%);
    box-shadow: 0 8px 24px rgba(20, 4, 43, .38), inset 0 1px 0 rgba(255,255,255,.16);
    transform-origin: top left;
    transform: translateY(-140px) scale(var(--banner-scale));
    transition: transform .42s cubic-bezier(.2,.85,.25,1.12);
  }
  .banner.visible { transform: translateY(0) scale(var(--banner-scale)); }
  .banner[data-pos="top-center"] { left: 50%; transform-origin: top center; transform: translate(-50%, -140px) scale(var(--banner-scale)); }
  .banner[data-pos="top-center"].visible { transform: translate(-50%, 0) scale(var(--banner-scale)); }
  .banner[data-pos="top-right"] { left: auto; right: 24px; transform-origin: top right; }
  .banner[data-pos="bottom-left"], .banner[data-pos="bottom-right"] { top: auto; bottom: 24px; transform-origin: bottom left; transform: translateY(140px) scale(var(--banner-scale)); }
  .banner[data-pos="bottom-left"].visible, .banner[data-pos="bottom-right"].visible { transform: translateY(0) scale(var(--banner-scale)); }
  .banner[data-pos="bottom-right"] { left: auto; right: 24px; transform-origin: bottom right; }
  .banner.pulse { animation: banner-pulse .72s ease-out; }

  .brand { display: flex; align-items: center; min-width: 0; gap: 12px; }
  .brand-icon {
    width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center;
    border-radius: 50%; background: #772ce8;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 3px 8px rgba(40,8,84,.22);
  }
  .brand-icon svg { width: 25px; height: 30px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.22)); }
  .brand-name { font-size: 17px; line-height: 1.1; font-weight: 900; letter-spacing: .55px; white-space: nowrap; }

  .progress-area { align-self: center; min-width: 0; }
  .level-line { display: flex; align-items: baseline; gap: 9px; height: 34px; white-space: nowrap; }
  .level-number { font-size: 25px; font-weight: 900; letter-spacing: -.6px; }
  .tier-name { font-size: 15px; font-weight: 800; letter-spacing: .2px; opacity: .96; }
  .progress-line { display: flex; align-items: center; gap: 9px; }
  .progress-track {
    position: relative; height: 12px; flex: 1; overflow: hidden;
    border: 1px solid rgba(255,255,255,.25); border-radius: 3px;
    background: #6127b8; box-shadow: inset 0 1px 3px rgba(35,5,75,.55);
  }
  .progress-fill {
    position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 2px; overflow: visible;
    background: linear-gradient(90deg, #fff 0%, #f5edff 62%, #d7bcff 100%);
    box-shadow: 0 0 9px rgba(255,255,255,.76);
  }
  .liquid-edge {
    position: absolute; z-index: 2; top: -1px; right: -7px; width: 14px; height: calc(100% + 2px);
    overflow: visible; filter: drop-shadow(2px 0 3px rgba(255,255,255,.55));
  }
  .liquid-edge path { fill: #fff; fill-opacity: .92; }
  .fill-highlight {
    position: absolute; z-index: 1; top: -4px; bottom: -4px; left: -58px; width: 46px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.52), transparent);
    filter: blur(3px); animation: highlight-sweep 4.8s ease-in-out infinite;
  }
  .bubbles { position: absolute; inset: 0; z-index: 1; overflow: hidden; }
  .bubble {
    position: absolute; bottom: 1px; width: 3px; height: 3px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.9); background: rgba(255,255,255,.35);
    animation: bubble-drift 2.7s ease-in-out infinite alternate;
  }
  .bubble:nth-child(1) { left: 18%; animation-delay: -.6s; }
  .bubble:nth-child(2) { left: 43%; width: 2px; height: 2px; animation-delay: -1.8s; }
  .bubble:nth-child(3) { left: 70%; animation-delay: -1.1s; }
  .bubble:nth-child(4) { left: 88%; width: 2px; height: 2px; animation-delay: -.2s; }
  .liquid-edge, .fill-highlight, .bubbles { pointer-events: none; }
  @keyframes highlight-sweep { 0% { left: -58px; opacity: 0; } 18% { opacity: .75; } 82% { opacity: .55; } 100% { left: calc(100% + 58px); opacity: 0; } }
  @keyframes bubble-drift { from { transform: translate(0, 5px); opacity: .2; } to { transform: translate(12px, -5px); opacity: .8; } }
  @keyframes liquid-wave { to { transform: translateY(-1px); } }
  .percent { width: 39px; text-align: right; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }

  .stats { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 7px; min-width: 0; }
  .timer-row { display: flex; align-items: center; gap: 7px; font-size: 19px; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; }
  .timer-icon { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.9); border-radius: 50%; position: relative; }
  .timer-icon::before { content: ""; position: absolute; top: 2px; left: 5px; width: 1px; height: 4px; background: #fff; }
  .timer-icon::after { content: ""; position: absolute; top: 5px; left: 5px; width: 4px; height: 1px; background: #fff; transform: rotate(25deg); transform-origin: left center; }
  .chatters { font-size: 12px; line-height: 1; font-weight: 700; color: rgba(255,255,255,.86); white-space: nowrap; }
  .banner.summary-mode .brand, .banner.summary-mode .progress-area, .banner.summary-mode .stats { visibility: hidden; }
  .session-summary {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 12px 24px; text-align: center; font-size: 17px; font-weight: 900; letter-spacing: .25px;
    line-height: 1.3; text-shadow: 0 2px 5px rgba(50,10,95,.7);
  }
  .banner.summary-mode .session-summary { display: flex; }

  .level-up {
    position: absolute; z-index: 5; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.72); opacity: 0;
    color: #fff; font-size: 30px; font-weight: 900; letter-spacing: 2.2px;
    text-shadow: 0 2px 10px rgba(55,16,104,.8), 0 0 22px rgba(255,255,255,.75);
    pointer-events: none; white-space: nowrap;
  }
  .level-up.flash { animation: level-up-flash .82s cubic-bezier(.2,.75,.3,1) both; }
  .clip-pill {
    position: absolute; z-index: 4; top: var(--clip-offset, 136px); left: 24px;
    padding: 8px 14px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px;
    color: #fff; background: #772ce8; box-shadow: 0 5px 14px rgba(30,8,58,.36);
    font-size: 12px; font-weight: 800; letter-spacing: .35px;
    opacity: 0; transform: translateY(-7px); transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
  }
  .clip-pill.visible { opacity: 1; transform: translateY(0); }
  .clip-pill[data-pos="top-center"] { left: 50%; transform: translate(-50%, -7px); }
  .clip-pill[data-pos="top-center"].visible { transform: translate(-50%, 0); }
  .clip-pill[data-pos="top-right"] { left: auto; right: 24px; }
  .clip-pill[data-pos="bottom-left"], .clip-pill[data-pos="bottom-right"] { top: auto; bottom: var(--clip-offset, 136px); transform: translateY(7px); }
  .clip-pill[data-pos="bottom-left"].visible, .clip-pill[data-pos="bottom-right"].visible { transform: translateY(0); }
  .clip-pill[data-pos="bottom-right"] { left: auto; right: 24px; }
  canvas { position: absolute; z-index: 4; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  @keyframes banner-pulse {
    0%,100% { box-shadow: 0 8px 24px rgba(20,4,43,.38), inset 0 1px 0 rgba(255,255,255,.16); }
    36% { box-shadow: 0 0 0 5px rgba(255,255,255,.45), 0 0 34px rgba(145,70,255,.95), inset 0 1px 0 rgba(255,255,255,.3); }
  }
  @keyframes level-up-flash {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.72); }
    18% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
    72% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.04); }
  }
</style>
</head>
<body>
<main class="screen">
  <canvas id="confetti"></canvas>
  <section class="banner" id="banner" aria-live="polite">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.2 1.5 4 20h8l-1.1 14.5L24 15h-8.2l.4-13.5Z" fill="white"/>
        </svg>
      </div>
      <div class="brand-name">HYPE METER</div>
    </div>

    <div class="progress-area">
      <div class="level-line">
        <span class="level-number" id="levelNumber">LEVEL 0</span>
        <span class="tier-name" id="tierName">Building up...</span>
      </div>
      <div class="progress-line">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill">
            <div class="fill-highlight"></div>
            <div class="bubbles"><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i></div>
            <svg class="liquid-edge" id="liquidEdge" viewBox="0 0 14 100" preserveAspectRatio="none" aria-hidden="true"><path id="liquidPath"/></svg>
          </div>
        </div>
        <span class="percent" id="percent">0%</span>
      </div>
    </div>

    <div class="stats">
      <div class="timer-row"><span class="timer-icon" aria-hidden="true"></span><span id="timer">0:20</span></div>
      <div class="chatters" id="chatters">0 chatters</div>
    </div>
    <div class="session-summary" id="sessionSummary"></div>
    <div class="level-up" id="levelUp">LEVEL UP!</div>
  </section>
  <div class="clip-pill" id="clipPill">Clip saved</div>
</main>
<script>
(() => {
  const LEVELS = [
    { score: 0, name: 'Building up...' },
    { score: 3, name: 'NICE' },
    { score: 4.5, name: 'GREAT' },
    { score: 6, name: 'INSANE' },
    { score: 8, name: 'LEGENDARY' }
  ];
  const banner = document.getElementById('banner');
  const levelNumber = document.getElementById('levelNumber');
  const tierName = document.getElementById('tierName');
  const progressFill = document.getElementById('progressFill');
  const liquidEdge = document.getElementById('liquidEdge');
  const liquidPath = document.getElementById('liquidPath');
  const percentLabel = document.getElementById('percent');
  const timerLabel = document.getElementById('timer');
  const chattersLabel = document.getElementById('chatters');
  const levelUpFlash = document.getElementById('levelUp');
  const summaryLabel = document.getElementById('sessionSummary');
  const clipPill = document.getElementById('clipPill');
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  const SESSION_SECONDS = 20;
  let currentLevel = 0;
  let currentScore = 0;
  let targetProgress = 0;
  let displayedProgress = 0;
  let wavePhase = 0;
  let timerSeconds = SESSION_SECONDS;
  let latestChatters = 0;
  let maxSessionChatters = 0;
  let sessionActive = false;
  let endingSession = false;
  let lastStatusAt = null;
  let lastScore = 0;
  let hideTimer = null;
  let summaryTimer = null;
  let clipTimer = null;
  let flashTimer = null;
  let particles = [];
  let animationFrame = null;

  const allowedPositions = new Set(['top-left', 'top-center', 'top-right', 'bottom-left', 'bottom-right']);
  const params = new URLSearchParams(window.location.search);
  const requestedPosition = params.get('pos') || 'top-left';
  const position = allowedPositions.has(requestedPosition) ? requestedPosition : 'top-left';
  const requestedScale = Number(params.get('scale') || 1);
  const scaleMultiplier = Number.isFinite(requestedScale) && requestedScale > 0 ? requestedScale : 1;
  const bannerScale = .694444 * scaleMultiplier;
  banner.dataset.pos = position;
  clipPill.dataset.pos = position;
  document.documentElement.style.setProperty('--banner-scale', bannerScale);
  const clipOffset = `${40 + 96 * bannerScale}px`;
  clipPill.style.setProperty('--clip-offset', clipOffset);

  function resizeCanvas() {
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * ratio);
    canvas.height = Math.round(window.innerHeight * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function updateProgress() {
    const low = LEVELS[currentLevel].score;
    const high = LEVELS[currentLevel + 1] ? LEVELS[currentLevel + 1].score : low;
    const progress = currentLevel >= 4 ? 1 : Math.max(0, Math.min(1, (currentScore - low) / (high - low)));
    const percent = Math.round(progress * 100);
    targetProgress = percent;
    percentLabel.textContent = `${percent}%`;
    levelNumber.textContent = `LEVEL ${currentLevel}`;
    tierName.textContent = currentLevel === 0 ? 'Building up...' : LEVELS[currentLevel].name;
  }

  function animateLiquid() {
    displayedProgress += (targetProgress - displayedProgress) * .05;
    if (Math.abs(targetProgress - displayedProgress) < .01) displayedProgress = targetProgress;
    progressFill.style.width = `${displayedProgress}%`;
    liquidEdge.style.visibility = displayedProgress > .2 ? 'visible' : 'hidden';
    wavePhase += .075;
    const points = [];
    for (let y = 0; y <= 100; y += 5) {
      const x = 7 + Math.sin(wavePhase + y * .115) * 4.2;
      points.push(`L${x.toFixed(2)} ${y}`);
    }
    liquidPath.setAttribute('d', `M14 0 ${points.join(' ')} L14 100 Z`);
    requestAnimationFrame(animateLiquid);
  }

  function showBanner() {
    banner.classList.add('visible');
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = null;
  }

  function scheduleHide() {
    if (hideTimer) return;
    hideTimer = setTimeout(() => {
      banner.classList.remove('visible');
      currentLevel = 0;
      currentScore = 0;
      timerSeconds = SESSION_SECONDS;
      lastScore = 0;
      lastStatusAt = null;
      timerLabel.textContent = formatTimer(timerSeconds);
      updateProgress();
    }, 5000);
  }

  function beginSession() {
    if (sessionActive || endingSession) return;
    sessionActive = true;
    timerSeconds = SESSION_SECONDS;
    maxSessionChatters = latestChatters;
    lastStatusAt = performance.now() / 1000;
    lastScore = currentScore;
    timerLabel.textContent = formatTimer(timerSeconds);
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = null;
  }

  function endSession() {
    if (!sessionActive || endingSession) return;
    sessionActive = false;
    endingSession = true;
    timerSeconds = 0;
    timerLabel.textContent = formatTimer(timerSeconds);
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = null;
    const tier = currentLevel > 0 ? LEVELS[currentLevel].name : 'Building up';
    summaryLabel.textContent = `HYPE ENDED · LEVEL ${currentLevel} ${tier} · ${maxSessionChatters} chatters`;
    banner.classList.add('summary-mode', 'visible');
    summaryTimer = setTimeout(() => {
      banner.classList.remove('visible');
      setTimeout(() => {
        banner.classList.remove('summary-mode', 'pulse');
        summaryLabel.textContent = '';
        currentLevel = 0;
        currentScore = 0;
        timerSeconds = SESSION_SECONDS;
        latestChatters = 0;
        maxSessionChatters = 0;
        lastScore = 0;
        lastStatusAt = null;
        endingSession = false;
        timerLabel.textContent = formatTimer(timerSeconds);
        chattersLabel.textContent = '0 chatters';
        updateProgress();
      }, 450);
    }, 4000);
  }

  function formatTimer(seconds) {
    const total = Math.max(0, Math.ceil(seconds));
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
  }

  function updateStatus(event) {
    if (endingSession) return;
    const now = performance.now() / 1000;
    const nextScore = Math.max(0, Number(event.hype_score) || 0);
    const elapsed = lastStatusAt === null ? 1 : Math.max(0, Math.min(5, now - lastStatusAt));
    currentScore = nextScore;
    lastScore = nextScore;
    lastStatusAt = now;
    latestChatters = Math.max(0, Number(event.unique_chatters) || 0);
    chattersLabel.textContent = `${latestChatters} chatters`;
    if (sessionActive) {
      maxSessionChatters = Math.max(maxSessionChatters, latestChatters);
      if (nextScore > 1.5) timerSeconds = SESSION_SECONDS;
      else timerSeconds = Math.max(0, timerSeconds - elapsed);
    } else {
      timerSeconds = SESSION_SECONDS;
    }
    timerLabel.textContent = formatTimer(timerSeconds);
    updateProgress();

    if (currentScore > 1.5) showBanner();
    else if (!sessionActive && banner.classList.contains('visible')) scheduleHide();
    if (sessionActive && timerSeconds <= 0) endSession();
  }

  function levelFromTier(tier) {
    const index = LEVELS.findIndex((level, i) => i > 0 && level.name === tier);
    return index < 1 ? currentLevel : index;
  }

  function confetti() {
    const now = performance.now();
    const x = window.innerWidth / 2;
    const y = 65;
    const colors = ['#fff', '#e8d7ff', '#c59aff', '#9146ff', '#772ce8'];
    for (let i = 0; i < 90; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 90 + Math.random() * 460;
      particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 70,
        start: now, life: .45 + Math.random() * .95, size: 3 + Math.random() * 5,
        spin: Math.random() * Math.PI, spinSpeed: (Math.random() - .5) * 10,
        color: colors[Math.floor(Math.random() * colors.length)] });
    }
    if (animationFrame === null) animationFrame = requestAnimationFrame(drawConfetti);
  }

  function drawConfetti(now) {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    particles = particles.filter(p => (now - p.start) / 1000 < p.life);
    for (const p of particles) {
      const age = (now - p.start) / 1000;
      ctx.globalAlpha = Math.max(0, 1 - age / p.life);
      ctx.fillStyle = p.color;
      ctx.save();
      ctx.translate(p.x + p.vx * age, p.y + p.vy * age + 250 * age * age);
      ctx.rotate(p.spin + p.spinSpeed * age);
      ctx.fillRect(-p.size / 2, -p.size, p.size, p.size * 1.8);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (particles.length) animationFrame = requestAnimationFrame(drawConfetti);
    else { animationFrame = null; ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }

  function levelUp(tier, startsSession = false) {
    if (endingSession) return;
    if (startsSession) beginSession();
    const nextLevel = levelFromTier(tier);
    if (nextLevel <= currentLevel) return;
    currentLevel = nextLevel;
    currentScore = LEVELS[currentLevel].score;
    updateProgress();
    showBanner();
    banner.classList.remove('pulse');
    levelUpFlash.classList.remove('flash');
    void banner.offsetWidth;
    banner.classList.add('pulse');
    levelUpFlash.classList.add('flash');
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(() => levelUpFlash.classList.remove('flash'), 850);
    confetti();
  }

  function handleEvent(event) {
    if (event.type === 'status') updateStatus(event);
    if (event.type === 'trigger') levelUp(event.tier, true);
    if (event.type === 'tier_up' && sessionActive) levelUp(event.tier);
    if (event.type === 'clip') {
      clipPill.classList.add('visible');
      if (clipTimer) clearTimeout(clipTimer);
      clipTimer = setTimeout(() => clipPill.classList.remove('visible'), 4000);
    }
  }

  requestAnimationFrame(animateLiquid);

  if (new URLSearchParams(window.location.search).get('demo') === '1') {
    const started = performance.now();
    let activeCycle = -1;
    let fired = new Set();
    function demoLoop() {
      const total = (performance.now() - started) / 1000;
      const cycle = Math.floor(total / 46);
      const t = total % 46;
      if (cycle !== activeCycle) {
        activeCycle = cycle;
        fired = new Set();
        if (hideTimer) clearTimeout(hideTimer);
        if (summaryTimer) clearTimeout(summaryTimer);
        hideTimer = null;
        summaryTimer = null;
        banner.classList.remove('visible');
        banner.classList.remove('summary-mode', 'pulse');
        currentLevel = 0;
        currentScore = 0;
        timerSeconds = SESSION_SECONDS;
        latestChatters = 0;
        maxSessionChatters = 0;
        sessionActive = false;
        endingSession = false;
        lastScore = 0;
        lastStatusAt = null;
        timerLabel.textContent = formatTimer(timerSeconds);
        chattersLabel.textContent = '0 chatters';
        summaryLabel.textContent = '';
        updateProgress();
      }

      let hype;
      if (t < 1) hype = 0;
      else if (t < 4) hype = (t - 1) * .8;
      else if (t < 6) hype = 3 + (t - 4) * .75;
      else if (t < 7) hype = 4.5;
      else if (t < 17) hype = 1;
      else if (t < 18.5) hype = 1 + (t - 17) * (5.2 / 1.5);
      else if (t < 20) hype = 6.2;
      else hype = 0;
      handleEvent({ type: 'status', hype_score: hype, unique_chatters: Math.round(hype * 2), mean: 0 });

      const fire = (key, at, event) => {
        const id = `${cycle}:${key}`;
        if (t >= at && !fired.has(id)) { fired.add(id); handleEvent(event); }
      };
      fire('nice', 4, { type: 'trigger', tier: 'NICE' });
      fire('great', 6, { type: 'tier_up', tier: 'GREAT' });
      fire('insane', 18.5, { type: 'tier_up', tier: 'INSANE' });
      fire('clip', 19, { type: 'clip', title: 'INSANE moment', url: null });
      setTimeout(demoLoop, 200);
    }
    demoLoop();
  } else {
    const source = new EventSource('/events');
    source.onmessage = ({ data }) => {
      try { handleEvent(JSON.parse(data)); } catch (_) { /* Ignore malformed stream frames. */ }
    };
  }
})();
</script>
</body>
</html>
